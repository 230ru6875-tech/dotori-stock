<script>
const DEFAULT_WATCH=[

  {s:'ORCL',name:'오라클',p:164.31,pct:1.10,signal:'관찰-눌림대기-중립55'},
  {s:'SNDK',name:'샌디스크',p:226.20,pct:0.21,signal:'보유유지-추격매수금지-주의48'},
  {s:'AVGO',name:'브로드컴',p:369.57,pct:0.27,signal:'보유유지-분할매수대기-중립62'},
  {s:'QDVO',name:'QDVO',p:29.49,pct:0.44,signal:'보유유지'},
  {s:'TDAQ',name:'TDAQ',p:27.07,pct:-0.36,signal:'보유유지'}

// The center cards are the holdings surface. Ignore an older browser-local
// watchlist so QLD/NVDA or other stale symbols cannot displace current holdings.
let watch=DEFAULT_WATCH.map(item=>({...item}));
while(watch.length<6) watch.push(DEFAULT_WATCH[watch.length%DEFAULT_WATCH.length]);
watch=watch.slice(0,6);
let timeframe=localStorage.getItem('marketTf')||'5m';
let selectedSymbol=watch[0].s;
let chartRefs=[]; let indexRef=null;
const TF={ '1m':60,'3m':180,'5m':300,'15m':900 };
const leftGroups=[
 ['반도체',[

   ['ARM',265.68,1.59],['SK하이닉스',188.18,1.42],['마이크론',1008.70,.84],['샌디스크',1755.70,1.02],['브로드컴',369.57,.27]
 ]],
 ['AI 데이터센터',[

 ['AI 소프트웨어·하드웨어',[

   ['IBM',232.63,.23],['서비스나우',134.47,.19],['데이터독',210.19,-.02],['클라우드',209.61,-.20],['델',356.20,.03],['슈마컴',40.39,.30]
 ]],
 ['양자 컴퓨터',[

  ]],

 ]],

   ['테슬라',367.40,-.21],['포드',14.06,.43],['GM',86.23,.51]
 ]]
];
const rightGroups=[['핵심 ETF',[['SPY',766.64,.09],['QQQ',719.79,.20],['SCHD',34.42,.03],['DIA',527.82,-.04],['SMH',392.20,.54],['SOXX',328.14,.47]]]];
const market=[['나스닥 100 지수','29,568.2','0.24%'],['S&P 500 지수','7,688.80','0.11%'],['필라델피아 반도체 지수','11,887.87','1.30%'],['변동성 지수(VIX)','15.68','-0.19%'],['미국 10년 국채금리','4.804','0.25%'],['달러 인덱스','98.692','-0.15%'],['WTI 원유 선물','94.50','0.25%'],['원/달러 환율','1,335.68','-0.32%']];
function pctClass(v){return v>0?'up':v<0?'down':'flat'}
function signalClass(text){const t=String(text||'');if(/매수금지|신규매수금지|위험|회피|손절/.test(t))return 'danger';if(/주의|경계|대기|관찰/.test(t))return 'warn';if(/매수가능|매수우세|강한매수|눌림매수/.test(t))return 'buy';return 'neutral'}
function normalizeSignal(x,fallback='관찰'){if(!x)return fallback;if(typeof x.strategy_signal==='string'&&x.strategy_signal.trim())return x.strategy_signal.trim();if(typeof x.signal==='string'&&x.signal.trim())return x.signal.trim();const parts=[x.risk_condition,x.action,x.strategy_score_text].filter(v=>typeof v==='string'&&v.trim());return parts.length?parts.join('-'):fallback}
function fmt(v){return Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4})}
function groupHtml(title,rows){return `<section class="panel"><div class="section-title">${title}</div><table class="table"><thead><tr><th>종목</th><th>현재가</th><th>등락%</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${fmt(r[1])}</td><td class="${pctClass(r[2])}">${r[2]>=0?'+':''}${Number(r[2]).toFixed(2)}</td></tr>`).join('')}</tbody></table></section>`}
function renderSides(){leftCol.innerHTML=leftGroups.map(g=>groupHtml(g[0],g[1])).join('');rightCol.innerHTML=continuationGroups.map(g=>groupHtml(g[0],g[1])).join('')+rightGroups.map(g=>groupHtml(g[0],g[1])).join('')+`<section class="panel"><div class="section-title">핵심 시장 지표</div><div class="market-list">${market.map(r=>`<div class="market-row"><span>${r[0]}</span><span>${r[1]}</span><span class="${r[2].startsWith('-')?'down':'up'}">${r[2]}</span></div>`).join('')}</div></section>`}
function genCandles(base,n=120,step=300){const a=[];let p=base*.985,t=Math.floor(Date.now()/1000)-n*step,cumVol=0,cumPV=0;for(let i=0;i<n;i++){const drift=Math.sin(i/6)*.002+Math.cos(i/11)*.0012;const open=p,close=Math.max(.01,open*(1+drift+Math.sin(i*1.71)*.0015)),high=Math.max(open,close)*(1+.0012+Math.abs(Math.sin(i))*.0008),low=Math.min(open,close)*(1-.0012-Math.abs(Math.cos(i))*.0008),volume=Math.floor(10000+Math.abs(Math.sin(i*.73))*90000);a.push({time:t,open:+open.toFixed(4),high:+high.toFixed(4),low:+low.toFixed(4),close:+close.toFixed(4),volume});p=close;t+=step}return a}
function ma(data,period){const o=[];let sum=0;data.forEach((x,i)=>{sum+=x.close;if(i>=period)sum-=data[i-period].close;if(i>=period-1)o.push({time:x.time,value:sum/period})});return o}
function vwap(data){let cv=0,cpv=0;return data.map(x=>{const tp=(x.high+x.low+x.close)/3;cv+=x.volume;cpv+=tp*x.volume;return {time:x.time,value:cpv/cv}})}
function chartOptions(){return {layout:{background:{color:'#050607'},textColor:'#9ba7b3'},grid:{vertLines:{color:'#15191d'},horzLines:{color:'#15191d'}},rightPriceScale:{borderColor:'#252a30'},timeScale:{borderColor:'#252a30',timeVisible:true,secondsVisible:false},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},handleScale:true,handleScroll:true}}
function makeChart(el,data){const chart=LightweightCharts.createChart(el,chartOptions());const candle=chart.addCandlestickSeries({upColor:'#ef6b88',downColor:'#3f7cff',borderVisible:false,wickUpColor:'#ef6b88',wickDownColor:'#3f7cff',priceLineVisible:true});const vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',scaleMargins:{top:.80,bottom:0}});const ma5=chart.addLineSeries({color:'#65d9ff',lineWidth:1,priceLineVisible:false,lastValueVisible:false});const ma20=chart.addLineSeries({color:'#ffe25a',lineWidth:2,priceLineVisible:false,lastValueVisible:false});const ma60=chart.addLineSeries({color:'#ff9d5c',lineWidth:1,priceLineVisible:false,lastValueVisible:false});const vw=chart.addLineSeries({color:'#83e28f',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
 candle.setData(data);vol.setData(data.map(x=>({time:x.time,value:x.volume,color:x.close>=x.open?'rgba(239,107,136,.38)':'rgba(63,124,255,.38)'})));ma5.setData(ma(data,5));ma20.setData(ma(data,20));ma60.setData(ma(data,60));vw.setData(vwap(data));chart.timeScale().fitContent();const ro=new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth,height:el.clientHeight}));ro.observe(el);return {chart,candle,vol,ma5,ma20,ma60,vw,ro}}
function metrics(data){const last=data.at(-1),m20=ma(data,20).at(-1)?.value||last.close,m60=ma(data,60).at(-1)?.value||last.close,v=vwap(data).at(-1)?.value||last.close;const trend=last.close>m20&&m20>m60?'상승':last.close<m20&&m20<m60?'하락':'혼조';return {trend,ma20:last.close>=m20?'위':'아래',vwap:last.close>=v?'위':'아래'}}
function renderTf(){tfbar.innerHTML=Object.keys(TF).map(tf=>`<button class="tfbtn ${tf===timeframe?'active':''}" data-tf="${tf}">${tf}</button>`).join('');tfbar.querySelectorAll('button').forEach(b=>b.onclick=()=>{timeframe=b.dataset.tf;localStorage.setItem('marketTf',timeframe);renderAllCharts()})}
function renderMini(){miniGrid.innerHTML=watch.map((w,i)=>{const sig=normalizeSignal(w);return `<div class="mini" data-symbol="${w.s}"><div class="mini-head"><span class="symbol">${w.s}</span><span class="current-price" id="price-${i}">${fmt(w.p)}</span><span class="signal ${signalClass(sig)}" id="signal-${i}" title="${sig}">${sig}</span><span class="pct ${pctClass(w.pct)}" id="pct-${i}">${w.pct>=0?'+':''}${w.pct.toFixed(2)}%</span></div><div class="metricbar" id="metrics-${i}"></div><div class="chart" id="chart-${i}"></div></div>`}).join('');miniGrid.querySelectorAll('.mini').forEach(el=>el.onclick=()=>{selectedSymbol=el.dataset.symbol;miniGrid.querySelectorAll('.mini').forEach(x=>x.style.outline='none');el.style.outline='2px solid #6a7781'})}
function destroyCharts(){chartRefs.forEach(r=>{try{r.ro.disconnect();r.chart.remove()}catch(e){}});chartRefs=[];if(indexRef){try{indexRef.ro.disconnect();indexRef.chart.remove()}catch(e){}indexRef=null}}
function renderAllCharts(){destroyCharts();renderTf();renderMini();const step=TF[timeframe];const idxData=genCandles(29568,140,step);indexPrice.textContent=fmt(idxData.at(-1).close);indexRef=makeChart(indexChart,idxData);watch.forEach((w,i)=>{const d=genCandles(w.p,100,step);const last=d.at(-1);document.getElementById(`price-${i}`).textContent=fmt(last.close);const m=metrics(d);document.getElementById(`metrics-${i}`).innerHTML=`<span class="metric">추세 ${m.trend}</span><span class="metric">MA20 ${m.ma20}</span><span class="metric">VWAP ${m.vwap}</span>`;chartRefs.push(makeChart(document.getElementById(`chart-${i}`),d))})}
async function loadHoldings(){try{const res=await fetch('/web/data/dotoriweb/holdings.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('holdings unavailable');const json=await res.json();const positions=Array.isArray(json.positions)?json.positions:[];const next=positions.slice(0,6).map(item=>{const base=DEFAULT_WATCH.find(x=>x.s===item.symbol)||{};return {s:item.symbol,name:item.name||item.symbol,p:Number(item.current_price??item.avg_price??base.p??100),pct:Number(item.pnl_pct??base.pct??0),signal:base.signal||'보유유지'} }).filter(item=>item.s);if(!next.length)return;watch=next;while(watch.length<6)watch.push(DEFAULT_WATCH[watch.length%DEFAULT_WATCH.length]);watch=watch.slice(0,6);selectedSymbol=watch[0].s;localStorage.setItem('marketWatch',JSON.stringify(watch));renderAllCharts();loadMarket()}catch(e){/* Keep the built-in holdings fallback when the read-only holdings feed is unavailable. */}}
async function loadMarket(){try{const res=await fetch('/data/market.json?ts='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('no json');const json=await res.json();if(json.index?.price) indexPrice.textContent=fmt(json.index.price);if(json.symbols){watch.forEach((w,i)=>{const x=json.symbols[w.s];if(!x)return;if(Number.isFinite(x.price)){w.p=x.price;document.getElementById(`price-${i}`).textContent=fmt(x.price)}if(Number.isFinite(x.change_pct)){w.pct=x.change_pct;const e=document.getElementById(`pct-${i}`);e.textContent=`${x.change_pct>=0?'+':''}${x.change_pct.toFixed(2)}%`;e.className=`pct ${pctClass(x.change_pct)}`}const sig=normalizeSignal(x,w.signal);if(sig){w.signal=sig;const se=document.getElementById(`signal-${i}`);if(se){se.textContent=sig;se.title=sig;se.className=`signal ${signalClass(sig)}`}}if(Array.isArray(x.candles)&&x.candles.length){const d=x.candles.map(c=>({...c,time:typeof c.time==='string'?Math.floor(new Date(c.time).getTime()/1000):c.time}));const r=chartRefs[i];r.candle.setData(d);r.vol.setData(d.map(c=>({time:c.time,value:c.volume||0,color:c.close>=c.open?'rgba(239,107,136,.38)':'rgba(63,124,255,.38)'})));r.ma5.setData(ma(d,5));r.ma20.setData(ma(d,20));r.ma60.setData(ma(d,60));r.vw.setData(vwap(d));r.chart.timeScale().fitContent();const m=metrics(d);document.getElementById(`metrics-${i}`).innerHTML=`<span class="metric">추세 ${m.trend}</span><span class="metric">MA20 ${m.ma20}</span><span class="metric">VWAP ${m.vwap}</span>`}});dataMode.textContent='DATA: JSON';dataMode.className='pill mode-ok'}stamp()}catch(e){dataMode.textContent='DATA: DEMO';dataMode.className='pill mode-warn';stamp()}}
function stamp(){updated.textContent='UPDATED '+new Date().toLocaleTimeString('ko-KR',{hour12:false})}
addBtn.onclick=()=>{const s=symbolInput.value.trim().toUpperCase();if(!s)return;const idx=watch.findIndex(x=>x.s===selectedSymbol);if(watch.some(x=>x.s===s)){selectedSymbol=s;symbolInput.value='';return}watch[idx>=0?idx:5]={s,name:s,p:100,pct:0,signal:'관찰-데이터대기'};selectedSymbol=s;localStorage.setItem('marketWatch',JSON.stringify(watch));symbolInput.value='';renderAllCharts();loadMarket()}
removeBtn.onclick=()=>{const idx=watch.findIndex(x=>x.s===selectedSymbol);if(idx<0)return;watch.splice(idx,1);while(watch.length<6)watch.push({s:'EMPTY'+watch.length,name:'',p:100,pct:0,signal:'빈칸'});watch=watch.slice(0,6);selectedSymbol=watch[0].s;localStorage.setItem('marketWatch',JSON.stringify(watch));renderAllCharts();loadMarket()}
symbolInput.addEventListener('keydown',e=>{if(e.key==='Enter')addBtn.click()});
renderSides();renderAllCharts();stamp();loadHoldings();loadMarket();setInterval(loadMarket,30000);
</script>
</body>
